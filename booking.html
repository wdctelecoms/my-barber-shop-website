tion>Beard Grooming - K50</option><option>Kids Haircut - K60</option><option>Custom Style - Ask</option></select><label>Preferred date</label><input id='date' type='date' required style='width:100%;padding:14px;margin:6px 0 18px;border:1px solid #ddd;border-radius:6px'><label>Preferred time</label><input id='time' type='time' required style='width:100%;padding:14px;margin:6px 0 24px;border:1px solid #ddd;border-radius:6px'><button class='btn primary' style='border:0;width:100%;cursor:pointer'>Send Booking Request on WhatsApp</button><p class='muted' style='margin-top:15px;font-size:.85rem'>Your requested time is not confirmed until High Stars replies.</p></form></div></section><footer class='footer'><div class='container'>© 2026 <strong>High Stars Barbershop</strong> · +260 97 5559060</div></footer><script>const q=new URLSearchParams(location.search);if(q.get('service'))document.getElementById('service').value=q.get('service').replace(/-/g,'-');document.getElementById('date').min=new Date().toISOString().split('T')[0];document.getElementById('form').onsubmit=e=>{e.preventDefault();const msg=`Hello High Stars Barbershop!%0A%0AI would like to request an appointment.%0AName: ${encodeURIComponent(name.value)}%0APhone: ${encodeURIComponent(phone.value)}%0AService: ${encodeURIComponent(service.value)}%0ADate: ${encodeURIComponent(date.value)}%0ATime: ${encodeURIComponent(time.value)}`;open('https://wa.me/260975559060?text='+msg,'_blank')}</script></body></html>
